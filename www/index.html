<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ও৩ম্ কৃণ্বন্তো বিশ্বমার্যম্</title>
<link rel="stylesheet" href="css/app.css?v=71">
</head>
<body>

<header class="appBar">
  <button id="backBtn" class="iconBtn" aria-label="পেছনে">←</button>
  <div id="appTitle">ও৩ম্ কৃণ্বন্তো বিশ্বমার্যম্</div>
  <div class="appBarRight">
    <button id="searchBtn" class="iconBtn" aria-label="খুঁজুন">⌕</button>
    <button id="bookmarkBtn" class="iconBtn" aria-label="বুকমার্ক">🔖</button>
    <button id="settingsBtn" class="iconBtn" aria-label="সেটিংস">⚙️</button>
  </div>
</header>

<main id="app"></main>

<button id="addBookmarkFab" class="addBookmarkFab" aria-label="এই অংশ বুকমার্ক করুন" style="display:none;">🔖</button>

<nav id="bottomDock" class="bottomDock" aria-label="প্রধান নেভিগেশন">
  <button class="dockItem" data-dock-route="#/" aria-label="হোম">
    <span class="dockIcon" aria-hidden="true">🏠</span><span>হোম</span>
  </button>
  <button class="dockItem" data-dock-route="#/library" aria-label="লাইব্রেরি">
    <span class="dockIcon" aria-hidden="true">📚</span><span>লাইব্রেরি</span>
  </button>
  <button class="dockItem" data-dock-route="#/bookmarks" aria-label="বুকমার্ক">
    <span class="dockIcon" aria-hidden="true">🔖</span><span>বুকমার্ক</span>
  </button>
  <button class="dockItem" data-dock-route="#/search" aria-label="খুঁজুন">
    <span class="dockIcon" aria-hidden="true">🔍</span><span>খুঁজুন</span>
  </button>
  <button class="dockItem" data-dock-route="#/settings" aria-label="সেটিংস">
    <span class="dockIcon" aria-hidden="true">⚙️</span><span>সেটিংস</span>
  </button>
</nav>

<script src="js/master-db.js"></script>
<script src="js/db.js"></script>
<script src="js/lib.js"></script>
<script src="js/ramayana.js"></script>
    <script src="js/mahabharata.js"></script>
<script src="js/bookmarks.js"></script>
<script src="js/reading-position.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
    window.Capacitor.Plugins.App.addListener("backButton", function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.Capacitor.Plugins.App.exitApp();
      }
    });
  }
});
</script>
</body>
</html>
