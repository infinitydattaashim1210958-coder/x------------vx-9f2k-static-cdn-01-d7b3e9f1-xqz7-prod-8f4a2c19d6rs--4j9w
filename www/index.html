<!-- §48 Divine ambient field — persistent "living" backdrop (twinkling
     motes + slow-drifting embers + soft glow orbs). Lives OUTSIDE #app
     deliberately: #app's innerHTML is fully replaced on every route
     change (see router() in app.js), so anything meant to persist across
     screens without re-triggering its animations must sit here as a
     fixed sibling instead. Pure CSS animation, no JS required. -->
<div id="divineField" class="divineField" aria-hidden="true">
  <div class="glowOrb glowOrbA"></div>
  <div class="glowOrb glowOrbB"></div>
  <div class="motes">

<script>
document.addEventListener("DOMContentLoaded", function () {
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
    window.Capacitor.Plugins.App.addListener("backButton", function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.Capacitor.Plugins.App.exitApp();
      }
    });
  }
});
</script>
