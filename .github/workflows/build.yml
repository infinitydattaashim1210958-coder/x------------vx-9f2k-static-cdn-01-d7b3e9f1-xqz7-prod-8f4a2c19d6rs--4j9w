name: Build স্বাধ্যায় APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      # ── Core database (bundled in APK) ──────────────────────────────
      # core.db is always bundled — downloaded from the DB repo release.
      - name: Download core database from latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p www/assets/databases
          gh release download v1 \
            --repo "infinitydattaashim1210958-coder/-------------vx-9f2k-static-cdn-01-d7b3e9f1-xqz7-prod-8f4a2c19d6rs--4j9w" \
            --pattern "core.db.gz" --clobber --dir .
          gunzip -f core.db.gz
          mv core.db www/assets/databases/core.db
          echo "core.db size: $(du -sh www/assets/databases/core.db)"

      # ── Ramayana core database (bundled — sanskrit text only) ───────
      - name: Download Ramayana core database from latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1 \
            --repo "infinitydattaashim1210958-coder/-------------vx-9f2k-static-cdn-01-d7b3e9f1-xqz7-prod-8f4a2c19d6rs--4j9w" \
            --pattern "ramayana_core.db.gz" --clobber --dir .
          gunzip -f ramayana_core.db.gz
          mv ramayana_core.db www/assets/databases/ramayana_core.db
          echo "ramayana_core.db size: $(du -sh www/assets/databases/ramayana_core.db)"

      # ── Ramayana bhashya packs (NOT bundled) ─────────────────────────────
      # ramayana.db is NO LONGER shipped inside the APK.
      # It lives in the DB repo at /ramayana-kanpur-iit/ramayana.db.gz
      # and is downloaded at runtime by ramayana.js → downloadRamayana().
      # Nothing to do here at build time.

      # ── Mahabharata database ─────────────────────────────────────────
      # NOT bundled at build time. mahabharata.js downloads each পর্ব
      # pack (mahabharata_parba_N.db.gz) on demand at runtime via
      # mbDownloadPack(), so there is no single "mahabharata.db.gz"
      # release asset to fetch here. (Previous step removed — it always
      # failed with "no assets match the file pattern".)

      - name: List databases
        run: ls -lh www/assets/databases/

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons and splash screen
        run: npx @capacitor/assets generate --android

      - name: Sync web assets + plugins into Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Do not compress .db assets (avoids OOM on large SQLite files)
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if ! grep -q "aaptOptions" "$BUILD_GRADLE"; then
            sed -i '/^android {/a\    aaptOptions { noCompress "db" }' "$BUILD_GRADLE"
          fi
          echo "----- aaptOptions after patch -----"
          grep -n "aaptOptions" -A 2 "$BUILD_GRADLE"

      - name: Increase Gradle daemon heap size
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
            echo "org.gradle.daemon=false"
          } >> android/gradle.properties
          cat android/gradle.properties

      - name: Build স্বাধ্যায় APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/swadhyay.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swadhyay
          path: android/app/build/outputs/apk/debug/swadhyay.apk
          retention-days: 1
